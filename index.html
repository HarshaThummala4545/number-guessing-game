<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Number Guessing Game
    </title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- 🌌 Cinematic Particles -->

    <div class="particles">

        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>

    </div>


    <!-- 🎮 Main Container -->

    <div class="container">

        <h1>
            🎯 Number Guessing Game
        </h1>

        <p class="subtitle">
            Guess a number between 1 and 100
        </p>


        <!-- 📊 Stats -->

        <div class="stats">

            <div class="card">
                ❤️ Lives:
                <span id="lives">10</span>
            </div>

            <div class="card">
                ⏳ Time:
                <span id="timer">60</span>s
            </div>

            <div class="card">
                🏆 Best:
                <span id="bestScore">--</span>
            </div>

        </div>


        <!-- 🎯 Input -->

        <input
            type="number"
            id="guessInput"
            placeholder="Enter your guess"
        >


        <!-- 🔥 Buttons -->

        <button id="guessBtn">
            Guess Number
        </button>

        <button
            id="restartBtn"
            class="restart"
        >
            🔄 Restart Game
        </button>


        <!-- 💬 Messages -->

        <p id="message"></p>

        <p id="attempts">
            Attempts: 0
        </p>

    </div>


    <!-- 🎆 Confetti -->

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>


    <!-- ⚡ JavaScript -->

    <script src="script.js"></script>

</body>
</html>
